# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0 # Use a recent version
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-toml
    -   id: check-added-large-files
-   repo: https://github.com/psf/black
    rev: 24.8.0 # Use a recent version of Black
    hooks:
    -   id: black
        args: [--line-length=88] # Optional: specify line length
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0 # Use a recent version of Ruff
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix] # Auto-fix and report if fixes were made
    # Potentially add ruff-format if you want to use Ruff for formatting instead of Black
    # -   id: ruff-format
    #     args: [--line-length=88]
