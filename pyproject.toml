[tool.poetry]
name = "custom-ml-library"
version = "0.1.0"
description = "A custom machine learning library built from scratch."
authors = ["Subhajeet <subhajeet@subhajeet-mishra.me>"]
license = "MIT"
readme = "README.md"
packages = [{include = "custom_ml_library", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10"
polars = "^1.30.0"
numpy = "^2.2.6"
scipy = "^1.15.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
black = "^25.1.0"
ruff = "^0.11.12"
pre-commit = "^4.2.0"
pylint = "^3.1.0"
bandit = "^1.8.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# Ruff configuration
[tool.ruff]
line-length = 88 # Match Black's default line length

[tool.ruff.lint]
select = ["E", "F", "W", "I"] # Ensure "I" (isort rules) are selected.
# Removed [tool.ruff.lint.isort] section
